name: Build test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk barcode-wa-test.apk
          gh release create "test-${{ github.run_number }}" barcode-wa-test.apk \
            --title "בדיקה ${{ github.run_number }}" \
            --notes "אפליקציית בדיקה: שליחה ישירה לצ'אט בוואטסאפ." \
            --latest
