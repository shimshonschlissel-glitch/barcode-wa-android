name: Check that the code builds

# The app that people install is built and signed locally with the private key
# (see CLAUDE.md). This workflow only checks that both modules still compile.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        run: gradle :app:assembleDebug :tester:assembleDebug --no-daemon
