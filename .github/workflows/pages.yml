name: Publish the website

# Publishes web/ plus the Android app (dist/barcode-wa.apk) to GitHub Pages
# whenever they change on main. This is the live site; there is no other upload step.

on:
  push:
    branches: [main]
    paths: ["web/**", "dist/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp dist/barcode-wa.apk _site/barcode-wa.apk
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
